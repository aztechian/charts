{{- if include "tdarr.keysSecret.enabled" . -}}
{{- $nodeKey := .Values.server.nodeApiKey -}}
{{- if and $nodeKey.value (not $nodeKey.existingSecret) (not (regexMatch "^tapi_[A-Za-z0-9_]{9,}$" $nodeKey.value)) -}}
{{- fail "server.nodeApiKey.value must start with 'tapi_', be at least 14 characters long and only contain letters, numbers and underscores after 'tapi_'" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdarr.keysSecretName" . }}
  labels: {{- include "tdarr.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and (include "tdarr.proKey.value" .) (not .Values.server.proLicenseKey.existingSecret) }}
  proLicenseKey: {{ include "tdarr.proKey.value" . | b64enc | quote }}
  {{- end }}
  {{- if and $nodeKey.value (not $nodeKey.existingSecret) }}
  nodeApiKey: {{ $nodeKey.value | b64enc | quote }}
  {{- end }}
{{- end }}
